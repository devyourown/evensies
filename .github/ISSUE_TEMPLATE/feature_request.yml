name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Every feature stays free for everyone (see the promises in the README). For a question, open a blank issue instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, for example "On a trip with two currencies I can't …".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other ways to solve it, and how other apps handle it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Splitting and balances
        - Settle up and payments
        - Groups and friends
        - Currencies
        - Receipts and repeating expenses
        - Activity and notifications
        - Import and export
        - Web app
        - Self-hosting
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
