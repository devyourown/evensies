# Development: starts PostgreSQL and Mailpit (a fake SMTP server that catches mail). Run the server locally from an IDE or with ./gradlew bootRun.
# Its own project name, so the production docker-compose.yml in this folder never replaces these containers.
name: evensies-dev
services:
  # The dev profile's default SMTP (localhost:1025, no TLS). Caught mail is at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evensies
      POSTGRES_PASSWORD: evensies
      POSTGRES_DB: evensies
    ports:
      - "5432:5432"
    volumes:
      - evensies-pg-dev:/var/lib/postgresql/data
volumes:
  evensies-pg-dev:
    name: deploy_evensies-pg-dev   # the name from before the project had its own name, so existing dev data stays
