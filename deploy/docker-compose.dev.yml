# 개발용: PostgreSQL만 띄운다. 서버는 IDE나 ./gradlew bootRun 으로 로컬에서 실행.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evensies
      POSTGRES_PASSWORD: evensies
      POSTGRES_DB: evensies
    ports:
      - "5432:5432"
    volumes:
      - evensies-pg-dev:/var/lib/postgresql/data
volumes:
  evensies-pg-dev:
