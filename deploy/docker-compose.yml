# For production and self-hosting. `cp .env.example .env`, fill in the values, then `docker compose up -d`.
services:
  server:
    image: ghcr.io/devyourown/evensies-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      EVENSIES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-evensies}
      EVENSIES_DB_USER: ${POSTGRES_USER:-evensies}
      EVENSIES_DB_PASSWORD: ${POSTGRES_PASSWORD:-evensies}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro   # EVENSIES_FCM_CREDENTIALS_FILE=/secrets/fcm.json (optional)
      - ./data:/data            # EVENSIES_STORAGE_DIR: uploaded files such as profile photos. Back it up with the DB dumps
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evensies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evensies}
      POSTGRES_DB: ${POSTGRES_DB:-evensies}
    volumes:
      - evensies-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evensies}"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EVENSIES_DOMAIN: ${EVENSIES_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./well-known:/well-known:ro
      - caddy-data:/data
    depends_on:
      - server

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-evensies}
    entrypoint: ["/bin/sh", "-c"]
    # pg_dump daily at 03:00 → ./backups (the R2 upload runs from a host cron job with rclone; self-hosting keeps them local only)
    command:
      - |
        while true; do
          sleep $$(( ( 3*3600 - ( $$(date +%s) % 86400 ) + 86400 ) % 86400 ));
          pg_dump -h postgres -U ${POSTGRES_USER:-evensies} ${POSTGRES_DB:-evensies} | gzip > /backups/evensies-$$(date +%F).sql.gz;
          find /backups -name 'evensies-*.sql.gz' -mtime +14 -delete;
        done
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  evensies-pg:
  caddy-data:
