# Local development only. Never run production with this profile.
spring:
  datasource:
    url: ${EVENSIES_DB_URL:jdbc:postgresql://localhost:5432/evensies}

evensies:
  jwt-secret: dev-only-secret-do-not-use-in-production-0123456789
  # flutter run -d chrome --web-port 7357
  cors-origins: ${EVENSIES_CORS_ORIGINS:http://localhost:7357}
  auth:
    dev-login: true
  # Mailpit (docker-compose.dev.yml): SMTP on 1025, inbox at http://localhost:8025.
  email:
    smtp-host: ${EVENSIES_SMTP_HOST:localhost}
    smtp-port: ${EVENSIES_SMTP_PORT:1025}
    smtp-tls: ${EVENSIES_SMTP_TLS:none}
